name: Publish

# Tag a release (`git tag v0.1.0rc1 && git push --tags`) to build the sdist
# and wheel and upload them to TestPyPI by trusted publishing (no token:
# the project on test.pypi.org trusts this repository, this workflow file
# and the `testpypi` environment). Promote to PyPI by adding a second job
# with environment `pypi` and the default repository URL.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
