name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # wcc_etc comes from PyPI as a declared dependency. The raw FRED
          # stray-light map is private; the tests that rebuild the scatter
          # profile from it skip.
          pip install -e ".[test]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  wheel-smoke:
    # What a user gets from `pip install wcc-sim`: build the wheel from the
    # checkout, install it into an empty venv (wcc_etc resolved from PyPI)
    # and run an offline simulation at every focus level.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into an empty venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl

      - name: Smoke
        run: |
          cd /tmp   # not the checkout: the installed wheel must be what runs
          /tmp/venv/bin/wcc-sim --help > /dev/null
          /tmp/venv/bin/wcc-phot --help > /dev/null
          MPLBACKEND=Agg /tmp/venv/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
